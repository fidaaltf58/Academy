services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghazeli-academy
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-ghazeli-academy-secret-key-change-in-production}
    volumes:
      - ./data:/app/data
      - ./public/main-images:/app/public/main-images
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
  main-images:
